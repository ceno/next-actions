<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Next Actions — connect</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
  <body>
    <!--
      Path B only. Needed because checklist items are not reliably available from
      the client library inside card-badges (SPEC.md 6.2). If E1 says otherwise,
      this page and the two authorization capabilities are deleted.

      The copy below is the English fallback, shown before the module runs and
      whenever the localizer cannot answer. `data-i18n-id` matches the key in
      public/strings/*.json so Trello's own localizeNode would also find it.
    -->
    <p id="status" data-i18n-id="authorizeIntro">
      Next Actions needs read access to this board's checklists.
    </p>
    <button id="connect" class="mod-primary" data-i18n-id="authorizeConnect">Connect</button>
    <script type="module">
      import { mountAuthorize } from '../src/authorize.ts';
      mountAuthorize({
        status: document.getElementById('status'),
        connect: document.getElementById('connect'),
      });
    </script>
  </body>
</html>
