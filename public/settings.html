<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Next Actions — settings</title>
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css" />
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      /* Trello fixes the popup WIDTH; only height is ours to control. Never set
         a width here, and re-call t.sizeTo() on every reflow. */
      body { margin: 0; padding: 8px 4px; }
      h2 { font-size: 14px; margin: 12px 0 6px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
      .row label { flex: 1; }
      .row.disabled { opacity: 0.45; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      .note { font-size: 12px; opacity: 0.7; margin-top: 10px; }
    </style>
  </head>
  <body>
    <form id="settings" novalidate></form>
    <script type="module">
      import { mountSettings } from '../src/settings-ui.ts';
      mountSettings(document.getElementById('settings'));
    </script>
  </body>
</html>
